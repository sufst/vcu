# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: cppcheck
      files: [c]
      commands:
        - output: regex
          success_codes: [0]
          parse_regex: '((?P<path>.*):(?P<line>\d+):(?P<col>\d+): style: (?P<message>.*)) \[(?P<code>.*)\]'
          run: cppcheck --enable=all --suppress=unusedFunction --cppcheck-build-dir=./cppcheck ${target}
          read_output_from: stderr
          run_linter_from: workspace
          run_when: [cli, lsp, monitor, ci]
    - name: cppcheck-misra # MISRA C checker
      files: [c]
      commands:
        - output: regex
          success_codes: [0]
          parse_regex: '((?P<path>.*):(?P<line>\d+):(?P<col>\d+): style: (?P<message>.*)) \[(?P<code>.*)\]'
          run: cppcheck --addon=./.trunk/config/misra.json --cppcheck-build-dir=./cppcheck ${target}
          read_output_from: stderr
          run_linter_from: workspace
          run_when: [cli]
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.17
    - cppcheck@SYSTEM
    - clang-format@20.1.0
    - git-diff-check
    - isort@9.0.1
    - markdownlint@0.49.1
    - oxipng@10.2.1
    - prettier@3.9.6
    - ruff@0.16.7
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - trufflehog@3.97.4
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - src/AZURE_RTOS/**
        - src/Core/**
        - src/Drivers/**
        - src/Middlewares/**
        - src/FileX/**
        - src/USBX/**
        - scripts/**
    - linters: [clang-format]
      paths:
        - src/SUFST/Inc/config.h
        - src/SUFST/Src/config.c
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
